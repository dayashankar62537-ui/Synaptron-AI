<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviqo Design Studio</title>
<style>
  :root{ --bg:#faf7f2; --surface:#ffffff; --surface-2:#f4efe7; --text:#1d1a16; --muted:#6b6258; --border:#e4dccf; --accent:#1d1a16; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15120f; --surface:#1f1b17; --surface-2:#2a251f; --text:#f3eee6; --muted:#b7ab99; --border:rgba(255,236,210,.12); --accent:#f3eee6; --ok:#4ade80; --err:#f87171; } }
  :root[data-theme="dark"]{ --bg:#15120f; --surface:#1f1b17; --surface-2:#2a251f; --text:#f3eee6; --muted:#b7ab99; --border:rgba(255,236,210,.12); --accent:#f3eee6; --ok:#4ade80; --err:#f87171; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif;}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap;}
  header h1{font-size:18px; margin:0; font-weight:650;}
  header a{color:var(--muted); text-decoration:none; font-size:14px;}
  main{max-width:1200px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:20px; grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  section{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; min-width:0;}
  h2{font-size:16px; margin:0 0 12px; font-weight:650;}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px;}
  input,select,textarea{width:100%; font:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; min-width:0;}
  textarea{resize:vertical; min-height:76px;}
  input[type=color]{padding:3px; height:40px; width:72px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .row > *{flex:1 1 140px;}
  .btn{font:inherit; padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; transition:background .15s, transform .05s;}
  .btn:hover{background:var(--border);} .btn:active{transform:scale(.98);} .btn:disabled{opacity:.5; cursor:default;}
  .btn.primary{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .btn.primary:hover{opacity:.9; background:var(--accent);}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .preview{margin-top:14px; background:var(--surface-2); border-radius:12px; padding:10px; display:flex; justify-content:center; align-items:center; min-height:160px;}
  .preview svg, .preview img{max-width:100%; height:auto; display:block; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .note{font-size:13px; color:var(--muted); margin:8px 0 0;}
  .msg-err{color:var(--err); font-size:14px; margin:8px 0 0;}
  .msg-ok{color:var(--ok); font-size:14px; margin:8px 0 0;}
  .card{border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:12px; background:var(--surface-2);}
  .card img{width:100%; height:auto; border-radius:8px; display:block; background:#fff;}
  .card .meta{font-size:12.5px; color:var(--muted); margin:8px 0;}
  .skeleton{height:220px; border-radius:10px; background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2)); background-size:200% 100%; animation:sh 1.2s infinite linear;}
  @keyframes sh{from{background-position:200% 0} to{background-position:-200% 0}}
  .lib-item{display:flex; gap:10px; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .lib-item .name{font-weight:600;}
  .lib-item .sub{font-size:12.5px; color:var(--muted);}
  .lib-item .acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .lib-item .acts .btn{padding:5px 10px; font-size:13px;}
  .star{font-size:18px; background:none; border:0; color:var(--muted); cursor:pointer; padding:0 4px;}
  .star.on{color:#d97706;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .chip{font-size:12.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer;}
  .hint{font-size:12.5px; color:var(--muted);}
  .wide{grid-column:1 / -1;}
  /* ---- Large result cards (one per generated image) ---- */
  .results{display:flex; flex-direction:column; gap:22px; width:100%; max-width:1100px; margin:18px auto 0; box-sizing:border-box;}
  .rcard{box-sizing:border-box; width:100%; border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--surface-2); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .rhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .rstatus{font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--border);}
  .rstatus.done{color:#15803d;}
  .rstatus.error{color:#b91c1c;}
  .rprompt{margin:0 0 12px; font-size:15px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;}
  .rimgbtn{display:block; width:100%; padding:0; margin:0; border:0; background:var(--surface); border-radius:10px; cursor:zoom-in; overflow:hidden;}
  .rimgbtn img{display:block; width:100%; height:auto; max-height:min(78vh, 1000px); object-fit:contain; margin:0 auto; border-radius:10px; image-rendering:auto;}
  .rskel,.rnote{box-sizing:border-box; width:100%; aspect-ratio:var(--ar, 1 / 1); max-height:min(78vh, 1000px); border-radius:10px; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; font-size:14px; color:var(--muted); background:var(--surface);}
  .rskel{background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size:200% 100%; animation:rshim 1.4s linear infinite;}
  @keyframes rshim{from{background-position:200% 0} to{background-position:-200% 0}}
  .rnote.error{color:#b91c1c;}
  .rcard .btns{margin-top:12px;}
  .lb{position:fixed; inset:0; z-index:1000; background:rgba(6,8,12,.94); display:flex; align-items:center; justify-content:center; padding:64px 16px 16px; box-sizing:border-box;}
  .lb[hidden]{display:none !important;}
  .lb img{display:block; max-width:100%; max-height:calc(100vh - 96px); width:auto; height:auto; object-fit:contain; border-radius:8px;}
  .lb-bar{position:absolute; top:12px; right:12px; display:flex; gap:8px;}
  @media (max-width:600px){
    .results{gap:16px;}
    .rcard{padding:10px; border-radius:12px;}
    .rprompt{font-size:14px;}
    .rimgbtn img{max-height:70vh;}
  }
</style>
</head>
<body>
<header>
  <h1>Aviqo Design Studio</h1>
  <a href="chat.html">Back to chat</a>
</header>

<main>
  <!-- Design templates: text and shapes are real SVG, so the text is exact and editable -->
  <section>
    <h2>Design</h2>
    <label for="tpl">Format</label>
    <select id="tpl">
      <option value="thumbnail">YouTube thumbnail (1280×720)</option>
      <option value="instagram">Instagram post (1080×1080)</option>
      <option value="poster">Poster (1200×1800)</option>
      <option value="banner">Banner (1500×500)</option>
      <option value="ad">Advertisement (1080×1350)</option>
      <option value="presentation">Presentation slide (1600×900)</option>
      <option value="logo">Logo concept (512×512)</option>
    </select>
    <label for="fTitle">Main text</label>
    <input id="fTitle" maxlength="60" value="Learn faster with Aviqo">
    <label for="fSub">Supporting text</label>
    <input id="fSub" maxlength="90" value="Simple lessons, real examples">
    <label for="fExtra">Extra text (date, offer, handle, or brand name for a logo)</label>
    <input id="fExtra" maxlength="60" value="Watch now">
    <div class="row">
      <div><label for="c1">Colour 1</label><input id="c1" type="color" value="#1d4ed8"></div>
      <div><label for="c2">Colour 2</label><input id="c2" type="color" value="#7c3aed"></div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="btns">
      <button class="btn primary" id="dlPng" type="button">Download PNG</button>
      <button class="btn" id="dlSvg" type="button">Download SVG</button>
      <button class="btn" id="saveDesign" type="button">Save to library</button>
    </div>
    <p class="msg-err" id="designErr" role="alert" hidden></p>
    <p class="msg-ok" id="designOk" role="status" hidden></p>
    <p class="note">Text is drawn as vector text, so it is exact. The layout is fixed for each format.</p>
  </section>

  <!-- Image generation: text to image with an aspect ratio -->
  <section>
    <h2>Image generation</h2>
    <label for="genPrompt">Describe the image</label>
    <textarea id="genPrompt" maxlength="500" placeholder="A red fox sitting in fresh snow, soft morning light"></textarea>
    <div class="row">
      <div><label for="genAspect">Aspect ratio</label>
        <select id="genAspect"><option value="1:1">1:1 square</option><option value="16:9">16:9 landscape</option><option value="9:16">9:16 portrait</option><option value="4:5">4:5 post</option></select></div>
      <div><label for="genStyle">Style</label>
        <select id="genStyle"><option value="">Default</option><option value="photorealistic, natural light">Photorealistic</option><option value="flat vector illustration, clean shapes">Flat illustration</option><option value="watercolor painting">Watercolour</option><option value="minimal line art">Line art</option></select></div>
      <div><label for="genCount">Images</label>
        <select id="genCount"><option value="1">1 (2 credits)</option><option value="2">2 variations (4 credits)</option></select></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="genGo" type="button">Generate</button>
      <button class="btn" id="genCancel" type="button" hidden>Cancel</button>
    </div>
    <p class="hint" id="genStatus" role="status"></p>
    <p class="msg-err" id="genErr" role="alert" hidden></p>
    <div id="genResults" class="results" aria-live="polite"></div>
    <div id="lightbox" class="lb" hidden role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="lb-bar"><a id="lbDl" class="btn primary" href="#" download="aviqo-image.png">Download</a><button class="btn" id="lbClose" type="button">Close</button></div>
      <img id="lbImg" alt="">
    </div>
    <div class="chips" id="recentPrompts"></div>
  </section>

  <!-- Library: saved designs, searchable, with favourites -->
  <section class="wide">
    <h2>Library</h2>
    <div class="row">
      <div style="flex:2 1 260px"><input id="libSearch" placeholder="Search saved designs"></div>
      <div style="flex:0 0 auto"><label><input type="checkbox" id="libFav" style="width:auto"> Favourites only</label></div>
    </div>
    <div id="libList"></div>
    <p class="note" id="libNote"></p>
  </section>
</main>

<script>
(function(){
  'use strict';
  const LIB_KEY = 'aviqo_studio_projects';
  const PROMPT_KEY = 'aviqo_studio_prompts';
  const $ = (id) => document.getElementById(id);

  const TPL = {
    thumbnail: { w: 1280, h: 720 }, instagram: { w: 1080, h: 1080 }, poster: { w: 1200, h: 1800 },
    banner: { w: 1500, h: 500 }, ad: { w: 1080, h: 1350 }, presentation: { w: 1600, h: 900 }, logo: { w: 512, h: 512 }
  };

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function lum(hex){
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  // Wraps words into lines of at most maxChars characters.
  function wrap(text, maxChars, maxLines){
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    const lines = []; let cur = '';
    for (const w of words){
      const word = w.length > maxChars ? w.slice(0, maxChars) : w;
      if ((cur + ' ' + word).trim().length > maxChars){ if (cur) lines.push(cur); cur = word; }
      else cur = (cur + ' ' + word).trim();
    }
    if (cur) lines.push(cur);
    return lines.slice(0, maxLines || 4);
  }
  // Font size so the longest line fits the width (Arial-like glyphs are about 0.56em wide).
  function fit(lines, widthPx, maxSize){
    const longest = Math.max(1, ...lines.map(l => l.length));
    return Math.max(18, Math.min(maxSize, Math.floor(widthPx / (0.56 * longest))));
  }
  function textLines(lines, x, y, size, color, anchor, weight){
    return lines.map((l, i) => '<text x="' + x + '" y="' + (y + i * size * 1.15) + '" font-family="Arial, Helvetica, sans-serif" font-size="' + size + '" font-weight="' + (weight || 700) + '" fill="' + color + '" text-anchor="' + (anchor || 'start') + '">' + esc(l) + '</text>').join('');
  }

  function renderSvg(kind, f){
    const t = TPL[kind]; const W = t.w, H = t.h;
    const dark = lum(f.c1) > 0.45;
    const ink = dark ? '#111111' : '#ffffff';
    const soft = dark ? '#333333' : '#f1f5f9';
    const defs = '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + f.c1 + '"/><stop offset="1" stop-color="' + f.c2 + '"/></linearGradient></defs>';
    const bg = '<rect width="' + W + '" height="' + H + '" fill="url(#g)"/>';
    let body = '';
    if (kind === 'thumbnail'){
      const lines = wrap(f.title, 22, 3); const s = fit(lines, W * 0.6, 116);
      body = textLines(lines, 70, 300 - (lines.length - 1) * s * 0.575, s, ink) +
        (f.sub ? textLines(wrap(f.sub, 44, 2), 70, 300 + lines.length * s * 0.6 + 40, 40, soft, 'start', 400) : '') +
        (f.extra ? '<rect x="' + (W - 330) + '" y="40" width="290" height="70" rx="35" fill="#ef4444"/>' + '<text x="' + (W - 185) + '" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">' + esc(f.extra) + '</text>' : '');
    } else if (kind === 'instagram'){
      const lines = wrap(f.title, 18, 4); const s = fit(lines, W * 0.8, 110);
      body = textLines(lines, W / 2, 430, s, ink, 'middle') +
        (f.sub ? textLines(wrap(f.sub, 36, 2), W / 2, 430 + lines.length * s * 1.15 + 50, 44, soft, 'middle', 400) : '') +
        (f.extra ? textLines([f.extra], W / 2, H - 90, 40, ink, 'middle', 600) : '');
    } else if (kind === 'poster'){
      body = '<rect x="0" y="0" width="' + W + '" height="520" fill="rgba(0,0,0,.18)"/>' +
        textLines(wrap(f.title, 14, 4), 80, 240, 130, ink, 'start', 800) +
        (f.sub ? textLines(wrap(f.sub, 30, 3), 80, 900, 58, ink, 'start', 400) : '') +
        (f.extra ? '<rect x="80" y="' + (H - 260) + '" width="' + (W - 160) + '" height="110" rx="20" fill="' + ink + '" fill-opacity=".92"/>' +
          '<text x="' + (W / 2) + '" y="' + (H - 190) + '" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="' + (dark ? '#ffffff' : '#111111') + '" text-anchor="middle">' + esc(f.extra) + '</text>' : '');
    } else if (kind === 'banner'){
      const lines = wrap(f.title, 26, 2); const s = fit(lines, W * 0.6, 92);
      body = textLines(lines, 70, 220 - (lines.length - 1) * s * 0.575, s, ink) +
        (f.sub ? textLines(wrap(f.sub, 50, 2), 70, 330, 40, soft, 'start', 400) : '') +
        (f.extra ? '<rect x="' + (W - 430) + '" y="' + (H / 2 - 40) + '" width="360" height="80" rx="40" fill="' + ink + '"/>' +
          '<text x="' + (W - 250) + '" y="' + (H / 2 + 12) + '" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="' + (dark ? '#ffffff' : '#111111') + '" text-anchor="middle">' + esc(f.extra) + '</text>' : '');
    } else if (kind === 'ad'){
      const lines = wrap(f.title, 16, 3); const s = fit(lines, W * 0.8, 120);
      body = textLines(lines, 80, 330, s, ink) +
        (f.sub ? textLines(wrap(f.sub, 40, 2), 80, 330 + lines.length * s * 1.1 + 40, 46, soft, 'start', 400) : '') +
        '<circle cx="' + (W - 180) + '" cy="' + (H - 340) + '" r="130" fill="#facc15"/>' +
        textLines(wrap(f.extra || 'Offer', 9, 2), W - 180, H - 340 + 16, 44, '#111111', 'middle', 800) +
        '<rect x="80" y="' + (H - 200) + '" width="380" height="96" rx="48" fill="' + ink + '"/>' +
        '<text x="270" y="' + (H - 140) + '" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="' + (dark ? '#ffffff' : '#111111') + '" text-anchor="middle">Shop now</text>';
    } else if (kind === 'presentation'){
      const lines = wrap(f.title, 28, 2); const s = fit(lines, W * 0.85, 96);
      body = '<rect x="0" y="0" width="' + W + '" height="16" fill="' + ink + '" fill-opacity=".7"/>' +
        textLines(lines, 100, 300, s, ink) +
        (f.sub ? textLines(wrap(f.sub, 60, 2), 100, 300 + lines.length * s * 1.15 + 40, 48, soft, 'start', 400) : '') +
        (f.extra ? '<text x="100" y="' + (H - 80) + '" font-family="Arial, sans-serif" font-size="30" fill="' + soft + '">' + esc(f.extra) + '</text>' : '');
    } else if (kind === 'logo'){
      const initial = String(f.extra || f.title || 'A').trim().charAt(0).toUpperCase() || 'A';
      const name = String(f.extra || f.title || 'Brand').trim().slice(0, 24);
      body = '<circle cx="256" cy="210" r="130" fill="' + ink + '" fill-opacity=".95"/>' +
        '<text x="256" y="262" font-family="Arial, sans-serif" font-size="170" font-weight="800" fill="' + (dark ? '#ffffff' : '#111111') + '" text-anchor="middle">' + esc(initial) + '</text>' +
        '<text x="256" y="410" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="' + ink + '" text-anchor="middle">' + esc(name) + '</text>' +
        (f.sub ? '<text x="256" y="454" font-family="Arial, sans-serif" font-size="22" fill="' + soft + '" text-anchor="middle">' + esc(f.sub.slice(0, 40)) + '</text>' : '');
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + defs + bg + body + '</svg>';
  }

  function currentFields(){
    return { title: $('fTitle').value.trim(), sub: $('fSub').value.trim(), extra: $('fExtra').value.trim(), c1: $('c1').value, c2: $('c2').value };
  }
  function currentKind(){ return $('tpl').value; }

  function refresh(){
    const svg = renderSvg(currentKind(), currentFields());
    $('preview').innerHTML = svg;
  }
  ['tpl','fTitle','fSub','fExtra','c1','c2'].forEach(id => $(id).addEventListener('input', refresh));
  $('tpl').addEventListener('change', refresh);

  function showDesignMsg(err, ok){
    $('designErr').hidden = !err; $('designErr').textContent = err || '';
    $('designOk').hidden = !ok; $('designOk').textContent = ok || '';
  }
  function download(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function svgToPng(svg, w, h){
    return new Promise(function(resolve, reject){
      const img = new Image();
      img.onload = function(){
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(function(b){ if(b) resolve(b); else reject(new Error('PNG export failed')); }, 'image/png');
      };
      img.onerror = function(){ reject(new Error('Could not render this design. Try a different text.')); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }
  function fileBase(){ return (currentFields().title || 'design').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'design'; }

  $('dlPng').addEventListener('click', async function(){
    showDesignMsg('', '');
    const kind = currentKind(); const t = TPL[kind];
    try{
      const blob = await svgToPng(renderSvg(kind, currentFields()), t.w, t.h);
      download(blob, fileBase() + '-' + kind + '.png');
      showDesignMsg('', 'PNG downloaded (' + t.w + '×' + t.h + ').');
    }catch(e){ showDesignMsg(e.message || 'Export failed', ''); }
  });
  $('dlSvg').addEventListener('click', function(){
    const kind = currentKind();
    download(new Blob([renderSvg(kind, currentFields())], { type: 'image/svg+xml' }), fileBase() + '-' + kind + '.svg');
    showDesignMsg('', 'SVG downloaded.');
  });

  // ---- Library ----
  function readLib(){ try{ return JSON.parse(localStorage.getItem(LIB_KEY) || '[]') || []; }catch(e){ return []; } }
  function writeLib(list){
    try{ localStorage.setItem(LIB_KEY, JSON.stringify(list.slice(0, 100))); return true; }
    catch(e){ showDesignMsg('Browser storage is full. Delete some saved designs first.', ''); return false; }
  }
  $('saveDesign').addEventListener('click', function(){
    const f = currentFields();
    const list = readLib();
    list.unshift({ id: Date.now().toString(36), name: f.title || 'Untitled', kind: currentKind(), fields: f, favourite: false, updated: new Date().toISOString() });
    if (writeLib(list)){ showDesignMsg('', 'Saved to the library.'); renderLib(); }
  });
  function openDesign(item){
    $('tpl').value = item.kind;
    $('fTitle').value = item.fields.title || ''; $('fSub').value = item.fields.sub || ''; $('fExtra').value = item.fields.extra || '';
    $('c1').value = item.fields.c1; $('c2').value = item.fields.c2;
    refresh(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function renderLib(){
    const q = $('libSearch').value.trim().toLowerCase();
    const favOnly = $('libFav').checked;
    const all = readLib();
    const list = all.filter(i => (!q || i.name.toLowerCase().includes(q) || i.kind.includes(q)) && (!favOnly || i.favourite));
    $('libNote').textContent = all.length ? list.length + ' of ' + all.length + ' saved designs shown. Saved in this browser only.' : 'No saved designs yet. Use "Save to library" above.';
    $('libList').innerHTML = list.map(function(i){
      return '<div class="lib-item" data-id="' + esc(i.id) + '">' +
        '<div><div class="name">' + esc(i.name) + '</div><div class="sub">' + esc(i.kind) + ' · ' + esc(i.updated.slice(0,10)) + '</div></div>' +
        '<div class="acts"><button class="star' + (i.favourite ? ' on' : '') + '" data-act="fav" aria-label="Favourite" type="button">' + (i.favourite ? '★' : '☆') + '</button>' +
        '<button class="btn" data-act="open" type="button">Open</button><button class="btn" data-act="del" type="button">Delete</button></div></div>';
    }).join('');
  }
  $('libList').addEventListener('click', function(e){
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.closest('.lib-item').dataset.id;
    let list = readLib(); const item = list.find(i => i.id === id); if (!item) return;
    if (b.dataset.act === 'fav'){ item.favourite = !item.favourite; writeLib(list); renderLib(); }
    if (b.dataset.act === 'open'){ openDesign(item); }
    if (b.dataset.act === 'del'){
      if (!confirm('Delete "' + item.name + '" from the library?')) return;
      writeLib(list.filter(i => i.id !== id)); renderLib();
    }
  });
  $('libSearch').addEventListener('input', renderLib);
  $('libFav').addEventListener('change', renderLib);

  // ---- Image generation: each generation is its own result object and its own card ----
  // Real API: /api/generate-image. Only a returned image is shown as a success.
  const GENS_KEY = 'aviqo_studio_gens';
  const MAX_SAVED = 12;
  const AR = { '1:1': '1 / 1', '16:9': '16 / 9', '9:16': '9 / 16', '4:5': '4 / 5', '4:3': '4 / 3' };
  let genController = null;
  let busy = false;
  let cancelRequested = false;

  function readPrompts(){ try{ return JSON.parse(localStorage.getItem(PROMPT_KEY) || '[]') || []; }catch(e){ return []; } }
  function rememberPrompt(prompt, aspect){
    const list = readPrompts().filter(p => p.prompt !== prompt);
    list.unshift({ prompt: prompt, aspect: aspect, date: new Date().toISOString() });
    try{ localStorage.setItem(PROMPT_KEY, JSON.stringify(list.slice(0, 15))); }catch(e){}
    renderPrompts();
  }
  function renderPrompts(){
    $('recentPrompts').innerHTML = readPrompts().slice(0, 6).map(function(p, i){
      return '<button class="chip" type="button" data-i="' + i + '">' + esc(p.prompt.slice(0, 40)) + (p.prompt.length > 40 ? '…' : '') + '</button>';
    }).join('');
  }
  $('recentPrompts').addEventListener('click', function(e){
    const b = e.target.closest('.chip'); if (!b) return;
    const p = readPrompts()[Number(b.dataset.i)]; if (!p) return;
    $('genPrompt').value = p.prompt; $('genAspect').value = p.aspect || '1:1';
  });
  function userEmail(){
    try{ const u = JSON.parse(localStorage.getItem('aviqo_user') || 'null'); return u && u.email ? String(u.email).toLowerCase() : ''; }catch(e){ return ''; }
  }
  function genError(msg){ $('genErr').hidden = !msg; $('genErr').innerHTML = msg ? esc(msg) + ' <button class="btn" id="genRetry" type="button">Retry</button>' : ''; }

  // ---- Saved generations (browser storage; images are dropped from storage if the browser is full) ----
  function readGens(){
    try{
      const list = JSON.parse(localStorage.getItem(GENS_KEY) || '[]');
      if (!Array.isArray(list)) return [];
      return list.filter(g => g && typeof g.id === 'string' && typeof g.prompt === 'string').slice(0, MAX_SAVED);
    }catch(e){ return []; }
  }
  function saveGens(){
    const list = gens.filter(g => g.status !== 'pending').slice(0, MAX_SAVED).map(g => Object.assign({}, g));
    for (;;){
      try{ localStorage.setItem(GENS_KEY, JSON.stringify(list)); return; }catch(e){}
      let idx = -1;
      list.forEach((g, i) => { if (g.image) idx = i; });   // the oldest saved image is the last one
      if (idx < 0) return;
      list[idx] = Object.assign({}, list[idx], { image: null, status: 'expired' });
    }
  }
  let gens = readGens();

  // ---- Cards ----
  function statusText(g){
    return { pending: 'Generating', done: 'Completed', error: 'Failed', cancelled: 'Cancelled', expired: 'Not kept after reload' }[g.status] || g.status;
  }
  function cardEl(g){
    const card = document.createElement('article');
    card.className = 'rcard';
    card.dataset.id = g.id;
    card.dataset.status = g.status;
    const when = new Date(g.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const ar = AR[g.aspect] || '1 / 1';
    let media = '', actions = '';
    if (g.status === 'done'){
      media = '<button type="button" class="rimgbtn" data-act="full" aria-label="Open full-screen preview"><img alt="' + esc(g.prompt) + '" src="' + esc(g.image) + '"></button>';
      actions = '<a class="btn primary" download="aviqo-image-' + esc(g.id) + '.png" href="' + esc(g.image) + '">Download</a>' +
        '<button class="btn" type="button" data-act="regen">Regenerate</button>' +
        '<button class="btn" type="button" data-act="edit">Edit image</button>' +
        '<button class="btn" type="button" data-act="full">Full-screen preview</button>';
    } else if (g.status === 'pending'){
      media = '<div class="rskel" style="--ar:' + ar + '"><span>Generating your image…</span></div>';
      actions = '<span class="hint">Your image will appear here when it is ready.</span>';
    } else {
      const msg = g.status === 'expired'
        ? 'This image was not kept after the page reloaded. Regenerate to create it again.'
        : (g.error || 'This image was not generated.');
      media = '<div class="rnote ' + esc(g.status) + '" style="--ar:' + ar + '">' + esc(msg) + '</div>';
      actions = g.status === 'expired'
        ? '<button class="btn primary" type="button" data-act="regen">Regenerate</button><button class="btn" type="button" data-act="edit">Edit image</button>'
        : '<button class="btn primary" type="button" data-act="retry">Retry</button><button class="btn" type="button" data-act="edit">Edit image</button>';
    }
    card.innerHTML =
      '<div class="rhead"><span class="rstatus ' + esc(g.status) + '">' + esc(statusText(g)) + '</span><span>' + esc(g.aspect) + (g.status === 'done' && g.sizeApplied === false ? ' · this model returned its default square size' : '') + ' · ' + esc(when) + '</span></div>' +
      '<p class="rprompt">' + esc(g.prompt) + '</p>' + media +
      '<div class="btns">' + actions + '</div>';
    return card;
  }
  // Updates only the card of this generation; other cards stay as they are
  function updateCard(g){
    const list = $('genResults');
    const fresh = cardEl(g);
    const old = list.querySelector('[data-id="' + g.id + '"]');
    if (old) old.replaceWith(fresh); else list.prepend(fresh);
  }
  function newItem(prompt, aspect, style){
    return { id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), prompt: prompt, aspect: aspect, style: style || '', status: 'pending', image: null, error: '', sizeApplied: true, createdAt: Date.now() };
  }
  // Newest result goes to the top of the list
  function addCard(g){ gens.unshift(g); $('genResults').prepend(cardEl(g)); }

  // ---- Generation ----
  async function generateOne(prompt, aspect, signal){
    const res = await fetch('/api/generate-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, aspect: aspect, user: { email: userEmail() } }),
      signal: signal
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || ('Image generation failed (HTTP ' + res.status + ').'));
    return data;
  }
  async function runOne(g){
    g.status = 'pending'; g.error = ''; updateCard(g);
    genController = new AbortController();
    try{
      const full = g.style ? g.prompt + ', ' + g.style : g.prompt;
      const data = await generateOne(full, g.aspect, genController.signal);
      if (!data || typeof data.image !== 'string' || data.image.indexOf('data:image/') !== 0){
        throw new Error('The server did not return an image. Please try again.');
      }
      g.image = data.image;
      g.sizeApplied = data.sizeApplied !== false;
      g.status = 'done';
    }catch(err){
      if (cancelRequested || (err && err.name === 'AbortError')){ g.status = 'cancelled'; g.error = 'Cancelled.'; }
      else { g.status = 'error'; g.error = (err && err.message) || 'Something went wrong. Please try again.'; }
    }finally{
      genController = null;
    }
    updateCard(g);
    saveGens();
  }
  function setBusy(on){ busy = on; $('genGo').disabled = on; $('genCancel').hidden = !on; }
  async function runBatch(items){
    setBusy(true); cancelRequested = false;
    let ready = 0;
    try{
      for (let i = 0; i < items.length; i++){
        const g = items[i];
        if (cancelRequested){ g.status = 'cancelled'; g.error = 'Cancelled before it started.'; updateCard(g); continue; }
        $('genStatus').textContent = 'Generating image ' + (i + 1) + ' of ' + items.length + '… (usually 5 to 20 seconds)';
        await runOne(g);
        if (g.status === 'done') ready++;
      }
    }finally{
      setBusy(false);
    }
    const word = 'image' + (ready === 1 ? '' : 's');
    $('genStatus').textContent = cancelRequested ? ready + ' ' + word + ' kept. Cancelled the rest.' : (ready ? ready + ' ' + word + ' ready.' : '');
    saveGens();
  }

  $('genGo').addEventListener('click', function(){
    const prompt = $('genPrompt').value.trim();
    const aspect = $('genAspect').value;
    const count = Number($('genCount').value) || 1;
    const style = $('genStyle').value;
    genError('');
    if (!prompt){ genError('Describe the image first.'); return; }
    if (!userEmail()){ genError('Sign in on the chat page first, then come back here to generate images.'); return; }
    if (busy){ genError('An image is still generating. Wait for it to finish or cancel it.'); return; }
    rememberPrompt(prompt, aspect);
    const items = [];
    for (let i = 0; i < count; i++){ const g = newItem(prompt, aspect, style); addCard(g); items.push(g); }
    runBatch(items);
  });
  $('genCancel').addEventListener('click', function(){ cancelRequested = true; if (genController) genController.abort(); });
  $('genErr').addEventListener('click', function(e){ if (e.target && e.target.id === 'genRetry') $('genGo').click(); });

  // Card actions: full-screen, regenerate (new card), retry (same card), edit (fill the form)
  $('genResults').addEventListener('click', function(e){
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const card = btn.closest('.rcard'); if (!card) return;
    const g = gens.find(x => x.id === card.dataset.id); if (!g) return;
    const act = btn.dataset.act;
    if (act === 'full'){ openLightbox(g); return; }
    if (act === 'edit'){
      $('genPrompt').value = g.prompt; $('genAspect').value = g.aspect; $('genStyle').value = g.style || '';
      $('genPrompt').focus(); $('genPrompt').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (busy){ $('genStatus').textContent = 'Wait for the current image to finish, then try again.'; return; }
    if (act === 'regen'){ const n = newItem(g.prompt, g.aspect, g.style); addCard(n); runBatch([n]); }
    if (act === 'retry'){ runBatch([g]); }
  });

  // ---- Full-screen preview ----
  const lb = $('lightbox');
  function openLightbox(g){
    if (!g || g.status !== 'done' || !g.image) return;
    $('lbImg').src = g.image; $('lbImg').alt = g.prompt;
    $('lbDl').href = g.image; $('lbDl').download = 'aviqo-image-' + g.id + '.png';
    lb.hidden = false; $('lbClose').focus();
  }
  function closeLightbox(){ lb.hidden = true; $('lbImg').removeAttribute('src'); }
  lb.addEventListener('click', function(e){ if (e.target === lb || e.target.id === 'lbClose') closeLightbox(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

  // Restore saved generations (newest first)
  gens.forEach(g => $('genResults').appendChild(cardEl(g)));

  // Opened from the chat assistant: ?tpl=thumbnail&title=... pre-fills the design.
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get('tpl') && TPL[q.get('tpl')]) $('tpl').value = q.get('tpl');
    if (q.get('title')) $('fTitle').value = q.get('title').slice(0, 60);
  })();
  refresh(); renderLib(); renderPrompts();
})();
</script>
</body>
</html>
