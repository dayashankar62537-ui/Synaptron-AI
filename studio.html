<style>
  :root{
    --bg:#0a0b10; --bg-2:#0d0e15; --sidebar:#0b0c12;
    --surface:#12131c; --surface-2:#171826; --surface-soft:#15131f;
    --border:rgba(255,255,255,0.08); --border-hi:rgba(140,120,255,0.4);
    --text:#f2f1f7; --muted:#8b899c; --muted-2:#5c5a6c;
    --violet:#8b5cf6; --violet-2:#a78bfa; --violet-dim:rgba(139,92,246,0.14);
    --grad-brand:linear-gradient(120deg,#8b5cf6 0%,#6366f1 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:rgba(139,92,246,0.3);}

  .app{display:flex; height:100vh; height:100dvh;}

  /* ---------------- sidebar ---------------- */
  .sidebar{
    width:76px; flex:none; background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:22px;
    overflow-y:auto;
  }
  .side-logo{width:34px; height:34px; border-radius:9px; object-fit:cover;}
  .side-group{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;}
  .side-label{font-size:9.5px; letter-spacing:.1em; color:var(--muted-2); text-transform:uppercase; font-family:'JetBrains Mono',monospace; margin-bottom:2px;}
  .side-btn{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); background:transparent; border:none; cursor:pointer; transition:background .2s,color .2s;
  }
  .side-btn svg{width:19px; height:19px;}
  .side-btn:hover{background:rgba(255,255,255,0.05); color:var(--text);}
  .side-btn.active{background:var(--violet-dim); color:var(--violet-2); box-shadow:0 0 0 1px var(--border-hi) inset;}
  .side-div{width:30px; height:1px; background:var(--border); margin:2px 0;}

  /* ---------------- topbar ---------------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    height:60px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; border-bottom:1px solid var(--border);
  }
  .top-left{display:flex; align-items:center; gap:10px;}
  .back-pill{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--border); color:var(--muted);
    display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s;
  }
  .back-pill:hover{background:rgba(255,255,255,0.06); color:var(--text);}
  .brand-mini{display:flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;}
  .brand-mini img{width:24px; height:24px; border-radius:7px;}
  .top-right{display:flex; align-items:center; gap:16px;}
  .credit-pill{display:flex; align-items:center; gap:6px; color:var(--violet-2); font-weight:600; font-size:13.5px;}
  .credit-pill svg{width:15px; height:15px;}
  .bell{position:relative; color:var(--muted); width:18px; height:18px;}
  .bell .dot{position:absolute; top:-2px; right:-2px; width:7px; height:7px; border-radius:50%; background:#f97373; border:1.5px solid var(--bg);}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--grad-brand); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}

  /* ---------------- workspace ---------------- */
  .workspace{flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:40px 24px 28px;}
  .ws-inner{width:100%; max-width:760px; display:flex; flex-direction:column; flex:1;}
  .ws-mid{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:220px;}
  .ws-heading{font-family:'Space Grotesk',sans-serif; font-size:clamp(24px,3.4vw,34px); font-weight:600; text-align:center; line-height:1.25;}
  .ws-heading .dim{color:var(--muted-2);}

  .results{width:100%; display:flex; flex-direction:column; gap:16px; padding:8px 0 20px;}
  .result-card{border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:18px 20px;}
  .result-card .prompt-echo{color:var(--muted); font-size:12.5px; font-family:'JetBrains Mono',monospace; margin-bottom:10px;}
  .result-card .answer{font-size:14.5px; line-height:1.7; color:var(--text);}
  .result-card .answer ul{margin:8px 0 8px 18px;}
  .result-card img.gen-img{width:100%; max-width:420px; border-radius:12px; display:block; margin-top:6px;}
  .result-card video.gen-vid{width:100%; max-width:360px; border-radius:12px; display:block; margin-top:6px;}
  .result-card .status-line{display:flex; align-items:center; gap:9px; color:var(--muted); font-size:13px;}
  .spin{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--violet-2); animation:spin .8s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .result-card.error .answer{color:#f5a3a3;}

  .code-block{margin:10px 0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#0a0910;}
  .code-head{display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:rgba(255,255,255,0.04); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);}
  .code-copy{background:none; border:1px solid var(--border-hi); color:var(--text); border-radius:6px; padding:3px 10px; font-size:11px; cursor:pointer;}
  .code-block pre{margin:0; padding:12px; overflow-x:auto; max-height:360px;}
  .code-block code{font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.55; color:#f0eef7; white-space:pre;}
  code.inline{font-family:'JetBrains Mono',monospace; font-size:.9em; background:rgba(255,255,255,0.08); padding:1px 5px; border-radius:5px;}

  /* ---------------- controls row ---------------- */
  .controls-row{display:flex; justify-content:flex-end; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .ctrl-pill{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; cursor:pointer;
    transition:border-color .2s;
  }
  .ctrl-pill:hover{border-color:var(--border-hi);}
  .ctrl-pill svg{width:13px; height:13px; color:var(--muted);}

  /* ---------------- prompt box ---------------- */
  .prompt-box{
    border:1px solid var(--border-hi); border-radius:20px;
    background:linear-gradient(180deg, var(--surface-soft), var(--surface));
    padding:16px 18px 12px; box-shadow:0 0 0 1px rgba(139,92,246,0.06), 0 20px 60px -30px rgba(139,92,246,0.35);
  }
  .prompt-box textarea{
    width:100%; min-height:64px; max-height:180px; resize:none; border:none; outline:none; background:none;
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px; line-height:1.6;
  }
  .prompt-box textarea::placeholder{color:var(--muted-2);}
  .prompt-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .plus-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.04);
    color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .plus-btn:hover{background:rgba(255,255,255,0.09);}
  .generate-btn{
    display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:100px; border:none;
    background:var(--grad-brand); color:#fff; font-weight:600; font-size:14px; cursor:pointer;
    box-shadow:0 10px 26px -8px rgba(139,92,246,0.6); transition:transform .2s, opacity .2s;
  }
  .generate-btn svg{width:15px; height:15px;}
  .generate-btn:hover{transform:translateY(-1px);}
  .generate-btn:disabled{opacity:.55; cursor:default; transform:none;}
  .attach-chip{display:inline-flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border-radius:100px; background:rgba(255,255,255,0.06); border:1px solid var(--border); font-size:12px; color:var(--muted); margin-left:10px;}
  .attach-chip img{width:22px; height:22px; border-radius:6px; object-fit:cover;}
  .attach-chip button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px;}

  /* ---------------- tool tabs ---------------- */
  .tool-tabs{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; justify-content:center;}
  .tool-tab{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:13.5px; font-weight:500;
    cursor:pointer; transition:all .2s; white-space:nowrap;
  }
  .tool-tab svg{width:15px; height:15px;}
  .tool-tab:hover{color:var(--text); border-color:var(--border-hi);}
  .tool-tab.active{background:var(--violet-dim); border-color:var(--border-hi); color:var(--violet-2);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:20px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:760px){
    .sidebar{width:60px;}
    .side-btn{width:36px; height:36px;}
    .side-logo{width:28px; height:28px;}
    .topbar{padding:0 14px;}
    .brand-mini span{display:none;}
    .workspace{padding:26px 14px 18px;}
    .tool-tabs{gap:6px;}
    .tool-tab{padding:8px 12px; font-size:12.5px;}
    .controls-row{justify-content:center;}
  }
  @media (max-width:460px){
    .sidebar{display:none;}
    .credit-pill span{display:none;}
  }
</style>
</head>
<body>

<script>
(function(){
  const PLACEHOLDERS = {image: 'Describe the image you want Aviqo to create...', video: 'Describe the video you want Aviqo to create...', website: 'Describe the website you want Aviqo to build...', app: 'Describe the app you want Aviqo to build — features, platform, and users...', study: 'What do you want Aviqo to explain, summarize, or help you study?', assist: 'Tell Aviqo what you need help planning, drafting, or tracking...'};
  const LABELS = {image: 'Image Generation', video: 'Video Generation', website: 'Website Building', app: 'App Building', study: 'Study & Research', assist: 'Personal Assistant'};
  const params = new URLSearchParams(location.search);
  let currentTool = params.get('tool') || 'image';
  if(!PLACEHOLDERS[currentTool]) currentTool = 'image';

  const tabs = document.querySelectorAll('.tool-tab');
  const heading = document.getElementById('wsHeading');
  const promptInput = document.getElementById('promptInput');
  const secondary = document.getElementById('ctrlSecondary');
  const results = document.getElementById('results');
  const generateBtn = document.getElementById('generateBtn');
  const attachBtn = document.getElementById('attachBtn');
  const attachInput = document.getElementById('attachInput');
  const attachChip = document.getElementById('attachChip');
  let pendingImage = null;

  const SECONDARY_LABEL = { image:'Aspect Ratio', video:'Duration', website:'Style', app:'Platform', study:'Level', assist:'Tone' };

  function setTool(key){
    currentTool = key;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tool === key));
    promptInput.placeholder = PLACEHOLDERS[key];
    secondary.innerHTML = (SECONDARY_LABEL[key] || 'Aspect Ratio') + ' ' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 9l6 6 6-6"/></svg>';
    const url = new URL(location.href); url.searchParams.set('tool', key);
    history.replaceState(null, '', url);
  }
  tabs.forEach(t => t.addEventListener('click', () => setTool(t.dataset.tool)));
  setTool(currentTool);

  attachBtn.addEventListener('click', () => attachInput.click());
  attachInput.addEventListener('change', () => {
    const file = attachInput.files && attachInput.files[0];
    if(!file) return;
    if(file.size > 3.5*1024*1024){ alert('Please choose an image under 3MB.'); attachInput.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      pendingImage = { mimeType:file.type, data: dataUrl.split(',')[1] };
      attachChip.innerHTML = `<span class="attach-chip"><img src="${dataUrl}" alt=""><span>${file.name}</span><button type="button" id="attachRemove">&#10005;</button></span>`;
      document.getElementById('attachRemove').addEventListener('click', () => { pendingImage=null; attachInput.value=''; attachChip.innerHTML=''; });
    };
    reader.readAsDataURL(file);
  });

  function escapeHtml(str){ return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatText(chunk){
    const lines = escapeHtml(chunk).split(/\n+/).map(l=>l.trim()).filter(l=>l.length);
    let html='', inList=false;
    lines.forEach(line=>{
      line = line.replace(/`([^`]+)`/g,'<code class="inline">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      if(/^[-\u2022*]\s+/.test(line)){ if(!inList){html+='<ul>'; inList=true;} html+=`<li>${line.replace(/^[-\u2022*]\s+/,'')}</li>`; }
      else { if(inList){html+='</ul>'; inList=false;} html += (html?'<br>':'') + line; }
    });
    if(inList) html+='</ul>';
    return html;
  }
  function formatMessage(raw){
    const parts = String(raw).split(/```/); let html='';
    parts.forEach((part,i)=>{
      if(i%2===0) html += formatText(part);
      else {
        const nl = part.indexOf('\n');
        const lang = nl>-1 ? part.slice(0,nl).trim() : '';
        const code = (nl>-1 ? part.slice(nl+1) : part).replace(/\n$/,'');
        html += `<div class="code-block"><div class="code-head"><span>${escapeHtml(lang||'code')}</span><button type="button" class="code-copy">Copy</button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
      }
    });
    return html;
  }
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest && e.target.closest('.code-copy');
    if(!btn) return;
    const code = btn.closest('.code-block').querySelector('code').textContent;
    const done = ()=>{ btn.textContent='Copied'; setTimeout(()=>{btn.textContent='Copy';},1500); };
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(done).catch(()=>{});
  });

  async function readJson(res, fallback){
    const raw = await res.text(); let data=null; try{ data=JSON.parse(raw); }catch(e){}
    if(!res.ok || !data) throw new Error(data && data.error ? data.error : (fallback+' (error '+res.status+')'));
    return data;
  }

  const PROMPT_PREFIX = {
    app: 'Build an app based on this brief. Give a short plan, then the complete code for each file.\n\nBrief: ',
    website: 'Build a complete single-file index.html website based on this brief.\n\nBrief: ',
    study: 'Help me study/research the following. Be clear and structured.\n\n',
    assist: '',
  };

  function addResultCard(promptText){
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="prompt-echo">${escapeHtml(LABELS[currentTool])} &middot; "${escapeHtml(promptText).slice(0,120)}"</div><div class="answer"><div class="status-line"><span class="spin"></span>Generating...</div></div>`;
    results.prepend(card);
    return card;
  }

  async function runChatTool(promptText, card, image){
    const message = (PROMPT_PREFIX[currentTool] || '') + promptText;
    const payload = { message };
    if(image) payload.image = image;
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await readJson(res, 'The AI server had a problem');
    card.querySelector('.answer').innerHTML = formatMessage(data.reply);
  }
  async function runImageTool(promptText, card){
    const res = await fetch('/api/generate-image', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prompt: promptText }) });
    const data = await readJson(res, 'Image generation failed');
    card.querySelector('.answer').innerHTML = `<img class="gen-img" src="${data.image}" alt="Generated image">`;
  }
  async function runVideoTool(promptText, card){
    const startRes = await fetch('/api/video-start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prompt: promptText }) });
    const { id } = await readJson(startRes, 'Could not start video generation');
    card.querySelector('.answer').innerHTML = '<div class="status-line"><span class="spin"></span>Rendering your video (30-90s)...</div>';
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,5000));
      const res = await fetch('/api/video-status?id='+encodeURIComponent(id));
      const data = await readJson(res, 'Could not check video status');
      if(data.state==='completed' && data.video){ card.querySelector('.answer').innerHTML = `<video class="gen-vid" src="${data.video}" controls playsinline></video>`; return; }
      if(data.state==='failed') throw new Error(data.failure_reason || 'Video generation failed');
    }
    throw new Error('Video is taking longer than expected \u2014 please check back later');
  }

  async function handleGenerate(){
    const text = promptInput.value.trim();
    if(!text && !pendingImage) return;
    const card = addResultCard(text || '(attached photo)');
    generateBtn.disabled = true;
    const image = pendingImage;
    promptInput.value = ''; pendingImage = null; attachChip.innerHTML = ''; attachInput.value = '';
    try {
      if(currentTool === 'image') await runImageTool(text, card);
      else if(currentTool === 'video') await runVideoTool(text, card);
      else await runChatTool(text, card, image);
    } catch(err){
      card.classList.add('error');
      card.querySelector('.answer').textContent = "Couldn't complete that (" + err.message + "). Please try again.";
    } finally {
      generateBtn.disabled = false;
    }
  }
  generateBtn.addEventListener('click', handleGenerate);
  promptInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleGenerate(); } });
})();
</script>
</body>
</html>
