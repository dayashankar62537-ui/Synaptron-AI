<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Aviqo Team Workspace</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;650;700&display=swap">
<style>
/* Layout: left nav rail (desktop) / bottom scroll bar (phone) feeding a single content pane that swaps per section. */
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f1eefc; --surface-3:#e9e4fa;
  --ink:#201c33; --muted:#6c6680; --line:#e3ddf2;
  --accent:#7c3aed; --accent-2:#9f67f5; --accent-ink:#ffffff; --accent-bg:#ece4fd;
  --ok:#15803d; --ok-bg:#dcf5e3; --warn:#a85d00; --warn-bg:#fcecd0; --danger:#be123c; --danger-bg:#fce0e6;
  --shadow:0 1px 2px rgba(40,20,80,.04), 0 8px 24px -12px rgba(40,20,80,.14);
  --font-head:'Space Grotesk',Inter,system-ui,sans-serif; --font-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121020; --surface:#1a1730; --surface-2:#221d3d; --surface-3:#2a2449;
    --ink:#ece8f9; --muted:#a79fc4; --line:#352c57;
    --accent:#a888f7; --accent-2:#c3a8ff; --accent-ink:#1a1030; --accent-bg:#2b2350;
    --ok:#4fd98a; --ok-bg:#133523; --warn:#f0b24c; --warn-bg:#3a2a0e; --danger:#f17a93; --danger-bg:#3a1824;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121020; --surface:#1a1730; --surface-2:#221d3d; --surface-3:#2a2449;
  --ink:#ece8f9; --muted:#a79fc4; --line:#352c57;
  --accent:#a888f7; --accent-2:#c3a8ff; --accent-ink:#1a1030; --accent-bg:#2b2350;
  --ok:#4fd98a; --ok-bg:#133523; --warn:#f0b24c; --warn-bg:#3a2a0e; --danger:#f17a93; --danger-bg:#3a1824;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body)}
h1,h2,h3{margin:0;line-height:1.22;text-wrap:balance;font-family:var(--font-head)}
h1{font-size:23px;font-weight:650}
h2{font-size:17px;font-weight:650}
h3{font-size:14.5px;font-weight:600;font-family:var(--font-body)}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.warn-txt{color:var(--warn)}
.eyebrow{margin:0 0 3px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:234px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-head);font-weight:650;font-size:15px;padding:2px 8px}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.teamsel{padding:0 4px}
.teamsel select{font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .15s ease,color .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.rail-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}

.content{min-width:0;padding:22px 26px 56px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}

/* primitives */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .row{justify-content:space-between;margin-bottom:8px}
.stat .ic-badge{width:30px;height:30px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center}
.stat b{display:block;font-size:24px;font-weight:650;font-family:var(--font-head)}
.stat span{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.narrow{max-width:520px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{background:transparent;border-color:var(--line);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,.seg button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12.5px;min-width:0}
.sel{width:auto;max-width:100%;padding:5px 8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600}
.chip.accent{background:var(--accent-bg);color:var(--accent)}
.prio{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.p-low{background:var(--surface-3);color:var(--muted)}
.p-medium{background:var(--accent-bg);color:var(--accent)}
.p-high{background:var(--danger-bg);color:var(--danger)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-size:11.5px;white-space:nowrap;margin-left:auto;padding-top:1px}
.feed .dot{margin-top:5px;background:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:12px;flex:none;font-family:var(--font-head)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.empty .ic{width:30px;height:30px;margin:0 auto 10px;color:var(--muted)}

/* board */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(208px,1fr));gap:12px;min-width:880px}
.col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.col-h{display:flex;justify-content:space-between;font-weight:650;font-size:12.5px;padding:3px 5px;font-family:var(--font-head)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.task.late{border-color:var(--warn)}
.task-t{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.task-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* projects */
.proj-card{text-align:left;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);font:inherit;color:inherit;width:100%}
.proj-card:hover{border-color:var(--accent)}
.proj-top{display:flex;align-items:center;gap:10px}
.proj-dot{width:12px;height:12px;border-radius:4px;flex:none}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:min(640px,70vh);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:78%;padding:9px 12px;border-radius:13px;font-size:13.5px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.sys{align-self:center;max-width:92%;background:var(--warn-bg);color:var(--warn);font-size:12px;border-radius:10px;text-align:center}
.msg .who{display:block;font-size:11px;font-weight:650;opacity:.75;margin-bottom:2px}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface-2)}
.chat-form textarea{resize:none;height:40px;max-height:120px}
.suggests{display:flex;gap:8px;flex-wrap:wrap}
.suggest{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.suggest:hover{border-color:var(--accent);color:var(--accent)}

/* announcements */
.ann{border-top:1px solid var(--line);padding:13px 0}
.ann:first-child{border-top:0}
.ann-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pin{color:var(--accent)}

/* dialog + toast */
.dlg{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 32px));max-height:88vh;overflow:auto;opacity:0;transform:scale(.96) translateY(6px);transition:opacity .16s ease,transform .16s ease}
.dlg.show{opacity:1;transform:none}
.dlg::backdrop{background:rgba(20,10,40,0);transition:background .16s ease}
.dlg.show::backdrop{background:rgba(20,10,40,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.icon{background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);font-size:13px;z-index:30;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@media (prefers-reduced-motion: reduce){.toast,.btn,.dlg,.dlg::backdrop{transition:none}}

/* view transition */
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view{animation:viewIn .32s cubic-bezier(.16,1,.3,1) both}
.stats .stat{animation:viewIn .34s cubic-bezier(.16,1,.3,1) both}
.stats .stat:nth-child(1){animation-delay:.02s}
.stats .stat:nth-child(2){animation-delay:.06s}
.stats .stat:nth-child(3){animation-delay:.10s}
.stats .stat:nth-child(4){animation-delay:.14s}
@media (prefers-reduced-motion: reduce){.view,.stats .stat{animation:none}}

/* chart */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block}
.chart-ax{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart-grid{stroke:var(--line)}
.chart-bar{fill:var(--accent)}
.chart-area{fill:var(--accent-bg)}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{fill:var(--accent)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;align-items:center;border-right:0;border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5;gap:0;overflow-x:auto}
  .brand,.teamsel,.rail-foot{display:none}
  .nav{flex-direction:row;flex-wrap:nowrap}
  .nav a{flex-direction:column;gap:3px;padding:6px 10px;font-size:10.5px;white-space:nowrap}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 92px max(16px,env(safe-area-inset-left,0px))}
  .board{min-width:760px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark">A</span>Aviqo Team</div>
    <div class="teamsel" id="teamSelWrap"></div>
    <nav class="nav" id="navList" aria-label="Sections"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main class="content" id="app"></main>
</div>

<dialog id="dlg" class="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-h"><h2 id="dlgTitle"></h2><button type="button" class="icon" data-act="close" aria-label="Close">&times;</button></div>
  <div id="dlgBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const KEY = 'aviqo-team-workspace-v2';
const THEME_KEY = 'aviqo-team-theme';
const STATUSES = [['todo','To do'],['doing','In progress'],['review','Review'],['done','Done']];
const PRIORITIES = ['low','medium','high'];
const PROJECT_COLORS = ['#7c3aed','#2563eb','#0891b2','#15803d','#b45309','#be123c','#525252'];
const DAY = 864e5;

const ICONS = {
  overview:'<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>',
  members:'<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c0-3 2.5-5.3 5.5-5.3s5.5 2.3 5.5 5.3"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 14.6c2.6.3 4.5 2.4 4.9 4.9"/></svg>',
  projects:'<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 7.2c0-.9.7-1.6 1.6-1.6h4l1.6 2h8.2c.9 0 1.6.7 1.6 1.6v8.4c0 .9-.7 1.6-1.6 1.6H5.1c-.9 0-1.6-.7-1.6-1.6V7.2z"/></svg>',
  tasks:'<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.3l2.4 2.4L16.2 9"/></svg>',
  chat:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5c0-4 3.6-7 8-7s8 3 8 7-3.6 7-8 7c-1 0-2-.15-2.9-.45L5.5 19l1-3.3C5 14.3 4 13 4 11.5z"/><circle cx="9" cy="11.5" r=".4" fill="currentColor"/><circle cx="12" cy="11.5" r=".4" fill="currentColor"/><circle cx="15" cy="11.5" r=".4" fill="currentColor"/></svg>',
  activity:'<svg class="ic" viewBox="0 0 24 24"><polyline points="3.5,13 8,13 10,8 14,18 16,11 20.5,11"/></svg>',
  announce:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 10.5v3a1.3 1.3 0 0 0 1.3 1.3H7l3.6 3.3a.8.8 0 0 0 1.3-.6V6.5a.8.8 0 0 0-1.3-.6L7 9.2H5.3A1.3 1.3 0 0 0 4 10.5z"/><path d="M14.3 9.3c.8.7.8 3 0 3.7"/><path d="M16.6 7.3c1.7 1.6 1.7 5.1 0 6.8"/></svg>',
  settings:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.3M12 18.2v2.3M4.4 7l2 1.15M17.6 15.85l2 1.15M4.4 17l2-1.15M17.6 8.15l2-1.15"/></svg>',
  theme:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.4 9.8A6.8 6.8 0 0 1 12 3.5z"/></svg>'
};
const SECTIONS = [
  ['overview','Overview'], ['members','Members'], ['projects','Projects'], ['tasks','Tasks'],
  ['chat','Team AI Chat'], ['activity','Activity'], ['announce','Announcements'], ['settings','Settings']
];

let state = loadState();
let taskFilter = 'all';
let taskProjectFilter = '';
let activityFilter = 'all';
let pendingOk = null;
let chatDraft = '';

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.teams)) return s;
  }catch(e){}
  return { me: null, activeId: null, teams: [] };
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('This browser could not save the change. It will be lost on reload.', 'err'); }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function initials(n){ return String(n || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase(); }
function fmt(ts){ return new Date(ts).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}); }
function fmtDay(ts){ return new Date(ts).toLocaleDateString(undefined, {weekday:'short'}); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isOverdue(t){ return !!t.due && t.status !== 'done' && t.due < todayStr(); }
function activeTeam(){ return state.teams.find(t => t.id === state.activeId) || state.teams[0] || null; }
function roleOf(team){
  if (!team || !state.me) return null;
  const m = team.members.find(x => x.id === state.me.id);
  return m ? m.role : null;
}
function canEdit(team){ return ['owner','admin','member'].includes(roleOf(team)); }
function canManage(team){ return ['owner','admin'].includes(roleOf(team)); }
function who(){ return state.me ? state.me.name : 'Someone'; }
function log(team, text){
  team.activity.push({ t: Date.now(), text });
  if (team.activity.length > 300) team.activity.splice(0, team.activity.length - 300);
}
function toast(msg, kind){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2800);
}
function openDialog(title, html){
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = html;
  const d = $('#dlg');
  if (!d.open) d.showModal();
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('show')));
}
function closeDialog(){
  const d = $('#dlg');
  if (!d.open) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { d.classList.remove('show'); d.close(); return; }
  d.classList.remove('show');
  setTimeout(() => { if (d.open) d.close(); }, 160);
}
function openConfirm(msg, label, fn){
  pendingOk = fn;
  openDialog('Please confirm', `<p>${esc(msg)}</p><div class="row end" style="margin-top:18px"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn danger" data-act="confirm-ok">${esc(label)}</button></div>`);
}
function memberName(team, id){ const m = team.members.find(x => x.id === id); return m ? m.name : ''; }
function projectName(team, id){ const p = team.projects.find(x => x.id === id); return p ? p.name : ''; }
function projectOf(team, id){ return team.projects.find(x => x.id === id) || null; }

    const m = t.members.find(x => x.id === el.dataset.id);

  },
  'edit-team'(f){
    const t = activeTeam();
    if (!canManage(t)) return toast('Only owners and admins can edit the team.', 'err');
    const name = val(f, 'name');
    if (!name) return toast('Enter a team name.', 'err');
    t.name = name;
    t.description = val(f, 'description');
    log(t, `${who()} updated the team details`);
    saveState(); closeDialog(); render();
  },
  invite(f){
    const t = activeTeam();
    if (!canManage(t)) return toast('Only owners and admins can invite members.', 'err');
    const email = val(f, 'email').toLowerCase();
    const role = val(f, 'role');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email address.', 'err');
    if (!['admin','member','viewer'].includes(role)) return toast('Choose a role.', 'err');
    if (role === 'admin' && roleOf(t) !== 'owner') return toast('Only the owner can invite an admin.', 'err');
    if (t.members.some(m => (m.email || '').toLowerCase() === email)) return toast('That person is already a member.', 'err');
    if (t.invites.some(i => i.email === email)) return toast('An invite for that email is already pending.', 'err');
    t.invites.push({ id: uid(), email, role, created: Date.now(), expires: Date.now() + 7 * DAY });
    log(t, `${who()} invited ${email} as ${cap(role)}`);
    saveState(); render();
    toast('Invite saved. Sending the email needs the Vercel API connected to your mail provider.');
  },
  task(f){
    const t = activeTeam();
    if (!canEdit(t)) return toast('Your role cannot edit tasks.', 'err');
    const title = val(f, 'title');
    if (!title) return toast('Enter a task title.', 'err');
    const status = STATUSES.some(s => s[0] === val(f, 'status')) ? val(f, 'status') : 'todo';
    const priority = PRIORITIES.includes(val(f, 'priority')) ? val(f, 'priority') : 'medium';
    const data = { title, desc: val(f, 'desc'), status, priority, due: val(f, 'due'), assignee: val(f, 'assignee'), projectId: val(f, 'projectId') };
    const id = val(f, 'taskId');
    if (id) {
      const task = t.tasks.find(x => x.id === id);
      if (!task) return toast('That task no longer exists.', 'err');
      if (data.status === 'done' && task.status !== 'done') data.completedAt = Date.now();
      if (data.status !== 'done') data.completedAt = null;
      Object.assign(task, data);
      log(t, `${who()} updated "${title}"`);
    } else {
      t.tasks.push(Object.assign({ id: uid(), created: Date.now(), completedAt: status === 'done' ? Date.now() : null }, data));
      log(t, `${who()} created "${title}"`);
    }
    saveState(); closeDialog(); render();
  },
  project(f){
    const t = activeTeam();
    if (!canManage(t)) return toast('Only owners and admins can manage projects.', 'err');
    const name = val(f, 'name');
    if (!name) return toast('Enter a project name.', 'err');
    const id = val(f, 'projectId');
    const data = { name, desc: val(f, 'desc'), color: val(f, 'color') || PROJECT_COLORS[0], status: val(f, 'status') || 'active' };
    if (id) {
      const p = projectOf(t, id);
      if (!p) return toast('That project no longer exists.', 'err');
      Object.assign(p, data);
      log(t, `${who()} updated the project "${name}"`);
    } else {
      t.projects.push(Object.assign({ id: uid(), created: Date.now() }, data));
      log(t, `${who()} created the project "${name}"`);
    }
    saveState(); closeDialog(); render();
  },
  announcement(f){
    const t = activeTeam();
    if (!canManage(t)) return toast('Only owners and admins can post announcements.', 'err');
    const title = val(f, 'title');
    const body = val(f, 'body');
    if (!title || !body) return toast('Enter a title and a message.', 'err');
    t.announcements.unshift({ id: uid(), title, body, pinned: f.elements.pinned ? f.elements.pinned.checked : false, author: who(), created: Date.now() });
    log(t, `${who()} posted an announcement: "${title}"`);
    saveState(); closeDialog(); render();
  },
  chat(f){
    const t = activeTeam();
    const text = val(f, 'text');
    if (!text) return;
    t.chat.push({ id: uid(), authorId: state.me ? state.me.id : '', author: who(), text, t: Date.now(), kind: 'user' });
    t.chat.push({ id: uid(), author: 'Aviqo AI', text: 'This workspace is not connected to the Aviqo AI backend yet. Once a Vercel API route and model key are configured, your teammates’ questions will get real AI answers here.', t: Date.now(), kind: 'sys' });
    chatDraft = '';
    saveState(); render();
    requestAnimationFrame(() => { const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight; });
  },
};

/* ---------- small charts (plain SVG, drawn to real data) ---------- */
function barChart(pairs, w, h){
  const max = Math.max(1, ...pairs.map(p => p[1]));
  const padL = 26, padB = 16, padT = 8, bw = (w - padL - 8) / pairs.length;
  const bars = pairs.map((p, i) => {
    const bh = (h - padT - padB) * (p[1] / max);
    const x = padL + i * bw + bw * 0.18, bwi = bw * 0.64;
    const y = h - padB - bh;
    return `<rect class="chart-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="4"></rect>
      <text class="chart-ax" x="${(x+bwi/2).toFixed(1)}" y="${h-2}" text-anchor="middle">${esc(p[0])}</text>
      <text class="chart-ax" x="${(x+bwi/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${p[1]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Task count by status">
    <line class="chart-grid" x1="${padL}" y1="${h-padB}" x2="${w-4}" y2="${h-padB}"></line>${bars}</svg>`;
}
function trendChart(days, w, h){
  const max = Math.max(1, ...days.map(d => d.v));
  const padL = 20, padR = 10, padT = 10, padB = 18;
  const iw = w - padL - padR, ih = h - padT - padB;
  const step = days.length > 1 ? iw / (days.length - 1) : 0;
  const pts = days.map((d, i) => {
    const x = padL + i * step;
    const y = padT + ih - (d.v / max) * ih;
    return [x, y];
  });
  const line = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-padB} L ${pts[0][0].toFixed(1)} ${h-padB} Z`;
  const dots = pts.map((p,i) => `<circle class="chart-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"></circle>`).join('');
  const labels = days.map((d,i) => `<text class="chart-ax" x="${pts[i][0].toFixed(1)}" y="${h-3}" text-anchor="middle">${esc(d.label)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Tasks completed, last 7 days">
    <line class="chart-grid" x1="${padL}" y1="${padT+ih}" x2="${w-padR}" y2="${padT+ih}"></line>
    <path class="chart-area" d="${area}"></path><path class="chart-line" d="${line}"></path>${dots}${labels}</svg>`;
}

    <div class="stats">
      ${statCard('Members', team.members.length, 'members')}
      ${statCard('Pending invites', pending, 'announce')}
      ${statCard('Open tasks', open, 'tasks')}
      ${statCard('Completed tasks', done, 'overview')}
    </div>
    <div class="grid2">
      <section class="card">
        <div class="card-h"><h3>Tasks by status</h3></div>
        <div class="chart-wrap" style="margin-top:8px">${total ? barChart(statusPairs, 320, 150) : emptyState('tasks','No tasks yet','Create a task to see this chart fill in.')}</div>
      </section>
      <section class="card">
        <div class="card-h"><h3>Completed, last 7 days</h3></div>
        <div class="chart-wrap" style="margin-top:8px">${trendChart(days, 320, 150)}</div>
      </section>
    </div>
    <div class="grid2">
      <section class="card">
        <div class="card-h"><h3>Progress</h3><span class="chip accent">${pct}%</span></div>
        <p class="muted small" style="margin-top:6px">${done} of ${total} tasks done${overdue ? ` &middot; <span class="warn-txt">${overdue} overdue</span>` : ''}</p>
        <div class="bar" style="margin-top:10px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
      </section>
      <section class="card">
        <div class="card-h"><h3>Quick actions</h3></div>
        <div class="row" style="margin-top:10px">
          ${canEdit(team) ? '<button type="button" class="btn sm" data-act="new-task">New task</button>' : ''}
          ${canManage(team) ? '<a class="btn ghost sm" href="#members">Invite member</a>' : ''}
          <a class="btn ghost sm" href="#projects">View projects</a>
          <a class="btn ghost sm" href="#chat">Ask Aviqo AI</a>
        </div>
      </section>
    </div>
    <div class="grid2">
      <section class="card">
        <div class="card-h"><h3>${ICONS.chat} AI Assistant</h3></div>
        <p class="muted small" style="margin-top:6px">Ask about this team's work. Connect the Aviqo AI backend in Settings to get real answers.</p>
        <div class="suggests" style="margin-top:10px">${suggestions.map(s => `<button type="button" class="suggest" data-act="use-suggestion" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      </section>
      <section class="card">
        <div class="card-h"><h3>Announcements</h3><a class="small" href="#announce">See all</a></div>
        ${pinned.length ? `<ul class="list" style="margin-top:4px">${pinned.map(a => `<li class="item"><div class="grow"><b>${esc(a.title)}</b><div class="muted small" style="margin-top:2px">${esc(a.body)}</div></div></li>`).join('')}</ul>` : '<p class="muted small" style="margin-top:8px">No pinned announcements.</p>'}
      </section>
    </div>
    <section class="card">
      <div class="card-h"><h3>Recent activity</h3><a class="small" href="#activity">See all</a></div>
      ${acts.length
        ? `<ul class="feed" style="margin-top:6px">${acts.map(a => `<li><span class="dot"></span><span class="grow">${esc(a.text)}</span><time>${fmt(a.t)}</time></li>`).join('')}</ul>`
        : emptyState('activity','Nothing yet', 'Changes made by team members will appear here.')}
    </section>`;
}

function viewMembers(team){
  const manage = canManage(team);
  const myRole = roleOf(team);
  const rows = team.members.map(m => {
    const isOwner = m.role === 'owner';
    const isSelf = state.me && m.id === state.me.id;
    const roleCtl = manage && !isOwner
      ? `<select class="sel sm" data-change="role" data-id="${esc(m.id)}" aria-label="Role for ${esc(m.name)}">
          ${['admin','member','viewer'].filter(r => r !== 'admin' || myRole === 'owner' || m.role === 'admin').map(r => `<option value="${r}" ${r === m.role ? 'selected' : ''}>${cap(r)}</option>`).join('')}
         </select>`
      : `<span class="chip">${cap(m.role)}</span>`;
    const removeBtn = manage && !isOwner && !isSelf ? `<button type="button" class="btn danger-ghost sm" data-act="remove-member" data-id="${esc(m.id)}">Remove</button>` : '';
    return `<li class="item">
      <span class="avatar">${esc(initials(m.name))}</span>
      <div class="grow"><b>${esc(m.name)}</b>${isSelf ? ' <span class="muted small">(you)</span>' : ''}<div class="muted small">${esc(m.email || 'No email added')}</div></div>
      ${roleCtl}${removeBtn}
    </li>`;
  }).join('');
  const invites = team.invites.map(i => {
    const expired = i.expires <= Date.now();
    return `<li class="item">
      <div class="grow"><b>${esc(i.email)}</b><div class="muted small">${cap(i.role)} &middot; ${expired ? '<span class="warn-txt">Expired</span>' : 'Expires ' + fmt(i.expires)}</div></div>
      ${manage ? `<button type="button" class="btn ghost sm" data-act="renew-invite" data-id="${esc(i.id)}">Extend</button><button type="button" class="btn danger-ghost sm" data-act="revoke-invite" data-id="${esc(i.id)}">Revoke</button>` : ''}
    </li>`;
  }).join('');
  const inviteForm = manage ? `<section class="card">
      <h3>Invite a member</h3>
      <p class="muted small" style="margin-top:4px">Invites expire after 7 days. Sending the email needs the Vercel API connected to a mail provider.</p>
      <form class="fields" data-form="invite" style="margin-top:12px;align-items:end">
        <label>Email<input type="email" name="email" required maxlength="120" placeholder="name@company.com"></label>
        <label>Role<select name="role"><option value="member" ${team.settings.defaultInviteRole==='member'?'selected':''}>Member</option><option value="viewer" ${team.settings.defaultInviteRole==='viewer'?'selected':''}>Viewer</option>${myRole === 'owner' ? `<option value="admin" ${team.settings.defaultInviteRole==='admin'?'selected':''}>Admin</option>` : ''}</select></label>
        <div><button class="btn">Save invite</button></div>
      </form>
    </section>` : '';
  return `
    ${inviteForm}
    <section class="card">
      <h3>Members (${team.members.length})</h3>
      <ul class="list" style="margin-top:6px">${rows || '<li class="muted">No members yet.</li>'}</ul>
    </section>
    <section class="card">
      <h3>Pending invites (${team.invites.length})</h3>
      ${team.invites.length ? `<ul class="list" style="margin-top:6px">${invites}</ul>` : '<p class="muted" style="margin-top:8px">No pending invites.</p>'}
    </section>
    <section class="card">
      <h3>Roles</h3>
      <ul class="list" style="margin-top:6px">
        <li class="item"><b>Owner</b><span class="muted small">Full control, including deleting the team.</span></li>
        <li class="item"><b>Admin</b><span class="muted small">Manages members, invites, projects and tasks.</span></li>
        <li class="item"><b>Member</b><span class="muted small">Creates and edits tasks.</span></li>
        <li class="item"><b>Viewer</b><span class="muted small">Can read the team's work only.</span></li>
      </ul>
      <p class="muted small" style="margin-top:10px">Roles are checked in this browser only. Real access control must run on the server before the team is shared with anyone you don't fully trust.</p>
    </section>`;
}

function viewProjects(team){
  const manage = canManage(team);
  const cards = team.projects.map(p => {
    const tasks = team.tasks.filter(t => t.projectId === p.id);
    const done = tasks.filter(t => t.status === 'done').length;
    const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    return `<button type="button" class="proj-card" data-act="open-project" data-id="${esc(p.id)}">
      <div class="proj-top"><span class="proj-dot" style="background:${esc(p.color)}"></span><div class="grow"><h3>${esc(p.name)}</h3><span class="muted small">${cap(p.status)}</span></div>
        ${manage ? `<span class="icon-btn" role="button" tabindex="0" data-act="edit-project" data-id="${esc(p.id)}" aria-label="Edit ${esc(p.name)}" onclick="event.stopPropagation()">&#9998;</span>` : ''}</div>
      <p class="muted small">${esc(p.desc || 'No description.')}</p>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="muted small">${done}/${tasks.length} tasks done</span>
    </button>`;
  }).join('');
  return `
    <div class="toolbar"><h2 style="font-size:15px">All projects (${team.projects.length})</h2>${manage ? '<button type="button" class="btn sm" data-act="new-project">New project</button>' : ''}</div>
    ${team.projects.length ? `<div class="grid3" style="margin-top:14px">${cards}</div>` : `<section class="card" style="margin-top:14px">${emptyState('projects','No projects yet', manage ? 'Create a project to group related tasks together.' : 'Ask an admin to create the first project.')}</section>`}`;
}

function viewTasks(team){
  const can = canEdit(team);
  const me = state.me ? state.me.id : null;
  const activeProject = taskProjectFilter ? projectOf(team, taskProjectFilter) : null;
  let list = team.tasks.filter(t => taskFilter === 'all' || t.assignee === me);
  if (activeProject) list = list.filter(t => t.projectId === activeProject.id);
  const cardHtml = t => {
    const late = isOverdue(t);
    const proj = t.projectId ? projectOf(team, t.projectId) : null;
    return `<article class="task ${late ? 'late' : ''}">
      <button type="button" class="task-t" data-act="edit-task" data-id="${esc(t.id)}">${esc(t.title)}</button>
      <div class="task-m">${proj ? `<span class="chip"><span class="dot" style="background:${esc(proj.color)}"></span>${esc(proj.name)}</span>` : ''}<span class="prio p-${t.priority}">${cap(t.priority)}</span>${t.due ? `<span class="small ${late ? 'warn-txt' : 'muted'}">Due ${esc(t.due)}</span>` : ''}</div>
      <div class="muted small">${esc(memberName(team, t.assignee) || 'Unassigned')}</div>
      ${can ? `<select class="sel sm" data-change="task-status" data-id="${esc(t.id)}" aria-label="Status for ${esc(t.title)}">${STATUSES.map(([k,l]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
    </article>`;
  };
  const cols = STATUSES.map(([key, label]) => {
    const items = list.filter(t => t.status === key);
    return `<div class="col"><div class="col-h"><span>${label}</span><span class="count tnum">${items.length}</span></div>${items.length ? items.map(cardHtml).join('') : '<p class="muted small" style="margin:4px">No tasks</p>'}</div>`;
  }).join('');
  return `
    <div class="toolbar">
      <div class="row">
        <div class="seg" role="group" aria-label="Filter tasks">
          <button type="button" class="${taskFilter === 'all' ? 'on' : ''}" data-act="filter" data-v="all">All tasks</button>
          <button type="button" class="${taskFilter === 'mine' ? 'on' : ''}" data-act="filter" data-v="mine">My tasks</button>
        </div>
        ${activeProject ? `<span class="chip accent"><span class="dot" style="background:${esc(activeProject.color)}"></span>${esc(activeProject.name)}<button type="button" class="icon" style="font-size:14px;padding:0 0 0 4px" data-act="clear-project-filter" aria-label="Clear project filter">&times;</button></span>` : ''}
      </div>
      ${can ? `<button type="button" class="btn sm" data-act="new-task" data-project="${esc(taskProjectFilter)}">New task</button>` : ''}
    </div>
    ${team.tasks.length ? '' : `<section class="card" style="margin-top:14px">${emptyState('tasks','No tasks yet', can ? 'Create the first task and assign it to a member.' : 'Ask a team member to create the first task.')}</section>`}
    <div class="board-wrap" style="margin-top:14px"><div class="board">${cols}</div></div>`;
}

function viewChat(team){
  const msgs = team.chat.slice(-60);
  const items = msgs.length ? msgs.map(m => {
    if (m.kind === 'sys') return `<div class="msg sys">${esc(m.text)}</div>`;
    const mine = state.me && m.authorId === state.me.id;
    return `<div class="msg ${mine ? 'me' : 'them'}">${mine ? '' : `<span class="who">${esc(m.author)}</span>`}${esc(m.text)}</div>`;
  }).join('') : `<div class="msg sys">Ask anything about this team's tasks and projects. Replies need the Aviqo AI backend connected &mdash; until then you'll see a setup note here.</div>`;
  return `
    <section class="chat-wrap">
      <div class="chat-log" id="chatLog">${items}</div>
      <form class="chat-form" data-form="chat">
        <textarea name="text" placeholder="Ask Aviqo AI about this team&hellip;" required>${esc(chatDraft)}</textarea>
        <button class="btn" style="align-self:flex-end">Send</button>
      </form>
    </section>`;
}

function viewActivity(team){
  const acts = team.activity.slice().reverse();
  const groups = {};
  acts.forEach(a => {
    const d = new Date(a.t);
    const key = d.toLocaleDateString(undefined, { dateStyle: 'medium' });
    (groups[key] = groups[key] || []).push(a);
  });
  const html = Object.keys(groups).map(day => `
    <section class="card">
      <h3>${esc(day)}</h3>
      <ul class="feed" style="margin-top:6px">${groups[day].map(a => `<li><span class="dot"></span><span class="grow">${esc(a.text)}</span><time>${new Date(a.t).toLocaleTimeString(undefined,{timeStyle:'short'})}</time></li>`).join('')}</ul>
    </section>`).join('');
  return `
    <div class="toolbar"><h2 style="font-size:15px">All activity</h2></div>
    <div class="stack" style="margin-top:14px">${html || `<section class="card">${emptyState('activity','No activity yet','Every change your team makes here will be logged.')}</section>`}</div>`;
}

function viewAnnounce(team){
  const manage = canManage(team);
  const sorted = team.announcements.slice().sort((a,b) => (b.pinned - a.pinned) || (b.created - a.created));
  const html = sorted.map(a => `
    <article class="ann">
      <div class="ann-h"><div><b>${a.pinned ? '<span class="pin">&#128204;</span> ' : ''}${esc(a.title)}</b><div class="muted small" style="margin-top:2px">${esc(a.author)} &middot; ${fmt(a.created)}</div></div>
        ${manage ? `<div class="row"><button type="button" class="btn ghost sm" data-act="pin-announcement" data-id="${esc(a.id)}">${a.pinned ? 'Unpin' : 'Pin'}</button><button type="button" class="btn danger-ghost sm" data-act="delete-announcement" data-id="${esc(a.id)}">Delete</button></div>` : ''}
      </div>
      <p style="margin-top:8px">${esc(a.body)}</p>
    </article>`).join('');
  return `
    <div class="toolbar"><h2 style="font-size:15px">Announcements (${team.announcements.length})</h2>${manage ? '<button type="button" class="btn sm" data-act="new-announcement">New announcement</button>' : ''}</div>
    <section class="card" style="margin-top:14px">${html || emptyState('announce','No announcements yet', manage ? 'Post one so the whole team sees it here.' : 'Nothing posted yet.')}</section>`;
}

function viewSettings(team){
  const manage = canManage(team);
  const owner = roleOf(team) === 'owner';
  return `
    <div class="grid2">
      <section class="card">
        <h3>Team details</h3>
        <form class="stack" data-form="edit-team" style="margin-top:10px">
          <label>Team name<input name="name" required maxlength="60" value="${esc(team.name)}" ${manage ? '' : 'disabled'}></label>
          <label>Description<textarea name="description" rows="3" maxlength="200" ${manage ? '' : 'disabled'}>${esc(team.description || '')}</textarea></label>
          ${manage ? '<div class="row end"><button class="btn">Save</button></div>' : '<p class="muted small">Only owners and admins can edit these details.</p>'}
        </form>
      </section>
      <section class="card">
        <h3>Preferences</h3>
        <label class="row" style="flex-direction:row;align-items:center;gap:8px;font-weight:500;margin-top:10px"><input type="checkbox" style="width:auto" data-change="notif-pref" ${team.settings.notifyActivity ? 'checked' : ''}> Log a note here when something changes</label>
        ${manage ? `<label style="margin-top:14px">Default role for new invites<select class="sel" data-change="default-role">${['member','viewer','admin'].filter(r=>r!=='admin'||owner).map(r=>`<option value="${r}" ${team.settings.defaultInviteRole===r?'selected':''}>${cap(r)}</option>`).join('')}</select></label>` : ''}
      </section>
    </div>
    <section class="card">
      <h3>Connect your backend</h3>
      <p class="muted small" style="margin-top:6px">This workspace runs on local browser storage so it works right away. To make it real for your whole team:</p>
      <ul class="list" style="margin-top:4px">
        <li class="item"><b>Supabase</b><span class="muted small">Add tables for teams, members, invites, projects, tasks and messages, with row-level security per team.</span></li>
        <li class="item"><b>Vercel API routes</b><span class="muted small">Reuse your existing auth so invites, roles and the AI chat are enforced on the server, not just in this page.</span></li>
        <li class="item"><b>Aviqo AI backend</b><span class="muted small">Point Team AI Chat at your existing model endpoint so it answers with real team context.</span></li>
      </ul>
      <div class="row" style="margin-top:12px"><button type="button" class="btn ghost sm" data-act="copy-json">Copy this team's data as JSON</button></div>
    </section>
    ${owner ? `<section class="card">
      <h3 class="warn-txt">Danger zone</h3>
      <p class="muted small" style="margin-top:6px">Deleting a team removes its members, projects, tasks and messages from this browser. This cannot be undone.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn danger" data-act="delete-team">Delete this team</button></div>
    </section>` : ''}`;
}

/* ---------- render ---------- */
function render(){
  const team = activeTeam();
  const hash = location.hash.slice(1);
  const valid = SECTIONS.map(s => s[0]);
  const view = valid.includes(hash) ? hash : 'overview';

  $('#navList').innerHTML = SECTIONS.map(([k,l]) => `<a href="#${k}" data-nav="${k}" class="${view===k?'on':''}">${ICONS[k]}<span>${l}</span></a>`).join('');
  $('#teamSelWrap').innerHTML = state.teams.length
    ? `<select class="sel" style="width:100%" data-change="switch-team" aria-label="Switch team">${state.teams.map(t => `<option value="${esc(t.id)}" ${team && t.id === team.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>`
    : '';

  const titles = Object.fromEntries(SECTIONS);
  const role = roleOf(team);
  let body;
  if (!team) body = createCard();
  else if (view === 'members') body = viewMembers(team);
  else if (view === 'projects') body = viewProjects(team);
  else if (view === 'tasks') body = viewTasks(team);
  else if (view === 'chat') body = viewChat(team);
  else if (view === 'activity') body = viewActivity(team);
  else if (view === 'announce') body = viewAnnounce(team);
  else if (view === 'settings') body = viewSettings(team);
  else body = viewOverview(team);

  $('#app').innerHTML = `
    <div class="view" data-view="${view}">
    <header class="topbar">
      <div><p class="eyebrow">${team ? esc(team.name) : 'Team workspace'}</p><h1>${team ? titles[view] : 'Create your team'}</h1></div>
      <div class="tools">
        ${role ? `<span class="chip accent">You: ${cap(role)}</span>` : ''}
        ${team ? '<button type="button" class="btn ghost sm" data-act="new-team">New team</button>' : ''}
        <button type="button" class="icon-btn" data-act="theme" aria-label="Toggle theme">${ICONS.theme}</button>
      </div>
    </header>
    ${body}
    </div>`;
  $('#railFoot').innerHTML = state.me
    ? `<div class="row"><span class="avatar">${esc(initials(state.me.name))}</span><div><b style="color:var(--ink);display:block;font-size:12.5px">${esc(state.me.name)}</b><span class="small">Saved in this browser</span></div></div>`
    : '';
  if (view === 'chat') { const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight; }
}

/* ---------- wiring ---------- */
(function initTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act].icon-btn')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const fn = changes[el.dataset.change];
  if (fn) fn(el);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  // Guard against a double click/tap re-submitting the same form before its dialog
  // finishes closing (the close animation briefly keeps the old form in the DOM).
  if (f.dataset.submitting === '1') return;
  f.dataset.submitting = '1';
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
  if (f.isConnected) delete f.dataset.submitting;
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
